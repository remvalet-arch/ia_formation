<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merci — votre place est réservée · Clap de Famille</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#241c2e;--ink-soft:#5a5168;--cream:#fdf7ef;--cream-2:#f6ecdd;--gold:#e6a23c;--gold-deep:#c9822a;--green:#3f7d6b;--plum:#3a2b4d;
  --font-display:"Fraunces",Georgia,serif;--font-body:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--cream);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
.card{background:#fff;border-radius:28px;max-width:480px;width:100%;padding:40px 32px;text-align:center;
  box-shadow:0 24px 60px rgba(36,28,46,.18)}
.check{width:72px;height:72px;border-radius:50%;background:rgba(63,125,107,.12);color:var(--green);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
h1{font-family:var(--font-display);font-size:1.7rem;margin-bottom:10px}
p{color:var(--ink-soft);margin-bottom:14px}
.tier{display:inline-block;font-weight:700;color:var(--gold-deep);background:rgba(230,162,60,.14);
  padding:6px 14px;border-radius:999px;margin-bottom:18px}
.btn{display:inline-block;margin-top:8px;background:var(--gold);color:var(--ink);font-weight:700;
  padding:14px 26px;border-radius:999px;text-decoration:none}
.btn:hover{background:var(--gold-deep);color:#fff}
.small{font-size:.82rem;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="check"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>
  <span class="tier" id="tier" hidden></span>
  <h1>Votre place est réservée ! 🎬</h1>
  <p>Merci de votre confiance. Votre dépôt est <b>100&nbsp;% remboursable</b> jusqu'au lancement — le solde ne sera dû que si vous confirmez votre commande.</p>
  <p>On vous écrit très vite par email avec les prochaines étapes.</p>
  <a class="btn" href="index.html">Retour à l'accueil</a>
  <p class="small">Une question&nbsp;? <a href="mailto:contact@clapdefamille.fr">contact@clapdefamille.fr</a></p>
</div>

<script>
/* Déclenche l'event preorder_paid (anonyme) si le visiteur a déjà consenti sur la landing. */
(function(){
  var CONFIG = { POSTHOG_KEY:"POSTHOG_KEY", POSTHOG_HOST:"https://eu.i.posthog.com" };
  var params = new URLSearchParams(location.search);
  var tier = params.get("tier") || "inconnu";
  var LABELS = {auto:"Formule Auto · 49 €", confort:"Formule Confort · 89 €", cadeau:"Formule Cadeau · 149 €"};
  if(LABELS[tier]){ var el=document.getElementById("tier"); el.textContent=LABELS[tier]; el.hidden=false; }

  var consented = false;
  try{ consented = localStorage.getItem("cdf_consent") === "granted"; }catch(e){}
  if(consented && CONFIG.POSTHOG_KEY && CONFIG.POSTHOG_KEY !== "POSTHOG_KEY"){
    !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register identify opt_in_capturing opt_out_capturing".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
    posthog.init(CONFIG.POSTHOG_KEY,{api_host:CONFIG.POSTHOG_HOST,autocapture:false,capture_pageview:false});
    try{ posthog.capture("preorder_paid", {tier: tier}); }catch(e){}
  }
  console.debug("[track] preorder_paid", {tier: tier, consented: consented});
})();
</script>
</body>
</html>
